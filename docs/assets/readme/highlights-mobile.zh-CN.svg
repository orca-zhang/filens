  <title id="title">AI · PPTX · iWork 15 · Panorama</title>
  <desc id="desc">AI: 面向能力，自然表达. 说出需求，Agent 选择能力. 读取 · 搜索 · OCR · 转换; PPTX: 唯一真开源原生预览. 前端直接解析，体验更好. MIT · HTML / SVG; iWork 15: 唯一开源预览库. 支持纯前端原生渲染. 率先支持 iWork 15; Panorama: 厂商标定，实时全景. DJI / Insta360 官方标定. 照片与视频，纯前端渲染</desc>
