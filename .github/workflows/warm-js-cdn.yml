name: Warm JavaScript CDN

on:
  status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filens-cdn-warmup
  cancel-in-progress: true

jobs:
  warm:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.state == 'success' && github.event.context == 'Vercel' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/warm-js-cdn.test.mjs
      - run: node scripts/warm-js-cdn.mjs
