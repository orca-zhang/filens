syntax = "proto3";
package shoreline.observatory.v1;

// Fictional payload; timestamps are Unix milliseconds.
message Observation {
  string station_id = 1;
  int64 measured_at_ms = 2;
  optional double temperature_celsius = 3;
  optional uint32 humidity_percent = 4;
  Quality quality = 5;
  repeated string tags = 6;

  enum Quality {
    QUALITY_UNSPECIFIED = 0;
    QUALITY_VALID = 1;
    QUALITY_MISSING = 2;
    QUALITY_REVIEW = 3;
  }
}

message DailySummary {
  string station_id = 1;
  string local_date = 2;
  repeated Observation observations = 3;
}
