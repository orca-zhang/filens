# Fictional local reading-room site.
server {
    listen 8080;
    server_name localhost;
    root /srv/reading-room;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
    location /books/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /health {
        default_type text/plain;
        return 200 "reading room ready\n";
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
